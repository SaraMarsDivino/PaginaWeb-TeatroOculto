services:
  web:
    build: .
    restart: unless-stopped
    command: gunicorn teatro_project.wsgi:application --bind 0.0.0.0:8000 --workers 3
    # Bind-mount the project directory on the host (on the Pi this will be the cloned repo on the SD card)
    volumes:
      - ./:/app:rw
    env_file:
      - .env
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
    expose:
      - "8000"

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/teatro.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro
      - /home/pablo/certs:/etc/nginx/certs:ro

volumes: {}
